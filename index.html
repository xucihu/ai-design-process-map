<main class="page">
<h1>How designers use AI across the design process</h1>
<p class="intro">75 AI use cases from research and practice, mapped to the design process. Pick a step to see what AI does there and how acceptable practitioners find it.</p>

<div class="filters" id="filters" role="group" aria-label="Filter the map" hidden></div>

const SRCN={'nngroup.com':'NN/g','arxiv.org':'arXiv','measuringu.com':'MeasuringU','userinterviews.com':'User Interviews','dovetail.com':'Dovetail','docs.dovetail.com':'Dovetail','figma.com':'Figma','maze.co':'Maze','help.maze.co':'Maze','lyssna.com':'Lyssna','medium.com':'Medium','uxdesign.cc':'UX Collective','baymard.com':'Baymard','help.miro.com':'Miro','usertesting.com':'UserTesting','help.usertesting.com':'UserTesting','contentsquare.com':'Contentsquare','heymarvin.com':'Marvin','looppanel.com':'Looppanel','ethn.io':'Ethnio','mixpanel.com':'Mixpanel','producttalk.org':'Product Talk','ergosign.de':'Ergosign','greenlightidealab.com':'Greenlight','crowdlinker.com':'Crowdlinker','source.paris':'Source','blog.logrocket.com':'LogRocket','hvpandya.com':'Hardik Pandya','nature.com':'Nature','cambridge.org':'Cambridge','attentioninsight.com':'Attention Insight','brainsight.app':'Brainsight','mkremins.github.io':'C&C 2024','people.eecs.berkeley.edu':'UC Berkeley','mingmingfan.com':'CHI 2024','aaltodoc.aalto.fi':'Aalto','vtechworks.lib.vt.edu':'Virginia Tech','pmc.ncbi.nlm.nih.gov':'JEMR'};
function srcName(u){try{const h=new URL(u).hostname.replace(/^www\./,'');return SRCN[h]||h.split('.').slice(-2,-1)[0];}catch(e){return 'Source';}}
const LINKI='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1 1"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1-1"/></svg>';
const li=a=>{const m=a.t.match(/\(([^()]*)\)\s*$/);const body=m?a.t.slice(0,m.index).trim():a.t;
if(!a.u)return '<li>'+esc(a.t)+'</li>';
return '<li>'+esc(body)+' <a class="chip-src" href="'+esc(a.u)+'" target="_blank" rel="noopener" title="'+esc(m?m[1]:srcName(a.u))+'">'+esc(srcName(a.u))+'</a></li>';};
if(u.adv.length)h+='<h5>Advantages</h5><ul>'+u.adv.map(li).join('')+'</ul>';
if(u.dis.length)h+='<h5>Disadvantages</h5><ul>'+u.dis.map(li).join('')+'</ul>';
h+='<p class="popl"><span>Popularity</span>'+(POPN[u.pop]||u.pop)+(u.rechk?' <em class="rechk">Evidence still being checked</em>':'')+'</p>';
let ev='<h5>Why it\'s '+ACCN[u.acc].toLowerCase()+'</h5><p>'+esc(u.ar)+'</p><h5>How popularity was judged</h5><p>'+esc(u.pb)+'</p>';
if(u.res.length)ev+='<h5>Sources</h5><ul>'+u.res.map(r=>'<li><a href="'+esc(r.u)+'" target="_blank" rel="noopener">'+esc(r.t)+'</a> <span style="font-size:12px">('+esc(r.ty)+(r.y?', '+r.y:'')+')</span></li>').join('')+'</ul>';
if(u.vo)ev+='<div class="warn">All evidence for this use case comes from tool makers.</div>';
h+='<button class="rm ev-t" type="button" aria-expanded="false">Show evidence and sources</button><div class="evw"><div class="dwi"><div class="ev">'+ev+'</div></div></div>';
return h;}
render();
</script>
